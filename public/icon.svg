<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Clock ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#accent)" stroke-width="16" opacity="0.9"/>
  <!-- Tick marks -->
  <g stroke="#64748B" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="140"/>
    <line x1="376" y1="240" x2="356" y2="240"/>
    <line x1="256" y1="360" x2="256" y2="340"/>
    <line x1="136" y1="240" x2="156" y2="240"/>
  </g>
  <!-- Clock hands -->
  <line x1="256" y1="240" x2="256" y2="170" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="240" x2="320" y2="240" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="240" r="12" fill="url(#accent)"/>
  <!-- Relay indicator dots -->
  <g fill="url(#accent)">
    <circle cx="160" cy="420" r="14"/>
    <circle cx="220" cy="420" r="14"/>
    <circle cx="280" cy="420" r="14"/>
    <circle cx="340" cy="420" r="14" opacity="0.3"/>
  </g>
  <!-- Label -->
  <text x="256" y="468" font-family="monospace" font-size="20" fill="#94A3B8" text-anchor="middle" font-weight="600">TIMER 12CH</text>
</svg>
